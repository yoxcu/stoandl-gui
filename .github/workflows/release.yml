name: CI & Release

# Builds the Flatpak on every push/PR (CI gate), and on a `v*` tag publishes a
# GitHub Release with the .flatpak bundle, a source tarball (for the pmOS/Alpine
# APKBUILD — see packaging/APKBUILD), an aarch64 postmarketOS .apk built from that
# same APKBUILD, and an auto-generated changelog (cliff.toml).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      apk_version:
        description: >-
          Build the aarch64 pmOS apk from this ALREADY-PUBLISHED release version
          (no leading v) to iterate the Alpine build without cutting a tag, e.g. 0.2.0
        required: true
        default: "0.2.0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    name: Build Flatpak
    # Skip on manual dispatch — dispatch is for iterating the aarch64 apk job only.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      # GNOME flatpak-builder image; the tag's gnome-4x MUST match the manifest's
      # runtime-version (org.gnome.Platform 47). Bump both together. (The old
      # docker.io/bilelmoussaoui images are unmaintained — use flathub-infra's.)
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: de.yoxcu.stoandl.gui.flatpak
          manifest-path: data/de.yoxcu.stoandl.gui.flatpak.yml
          cache-key: flatpak-builder-${{ hashFiles('data/de.yoxcu.stoandl.gui.flatpak.yml') }}
          upload-artifact: false

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: de.yoxcu.stoandl.gui.flatpak
          if-no-files-found: error

  release:
    name: Release
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release + upload assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # source tarball + git-cliff need full history + tags

      - uses: actions/download-artifact@v4
        with:
          name: flatpak-bundle

      - name: Source tarball (for the pmOS/Alpine APKBUILD)
        run: |
          v="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="stoandl-gui-$v/" \
            -o "stoandl-gui-$v.tar.gz" HEAD

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # Fall back to a one-line body if a tag has only skipped commits (docs/chore).
          body: ${{ steps.cliff.outputs.content || format('Release {0}', github.ref_name) }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            de.yoxcu.stoandl.gui.flatpak
            stoandl-gui-*.tar.gz

  apk-aarch64:
    name: Build aarch64 pmOS package
    needs: release
    # A tag runs this after the release job; a manual dispatch runs it against an
    # already-published tarball (inputs.apk_version) to iterate without a new tag.
    # !cancelled() lets it run even though `release` is skipped on dispatch.
    if: >-
      !cancelled() &&
      (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the .apk to the release (tag runs only)
    steps:
      - uses: actions/checkout@v4

      - name: Point APKBUILD at the version
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            v="${{ inputs.apk_version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          sed -i "s/^pkgver=.*/pkgver=$v/" packaging/APKBUILD

      # Chroots into an aarch64 Alpine root under QEMU user-mode emulation and
      # pre-installs the makedepends from packaging/APKBUILD (Rust/Cargo + GTK4/
      # libadwaita + blueprint-compiler). These resolve in Alpine community; branch:
      # edge is kept for the freshest toolchain, but a stable branch would also work.
      - uses: jirutka/setup-alpine@v1
        with:
          arch: aarch64
          branch: edge
          extra-repositories: |
            https://dl-cdn.alpinelinux.org/alpine/edge/community
          packages: >
            alpine-sdk
            doas
            cargo
            gtk4.0-dev
            libadwaita-dev
            blueprint-compiler
            glib-dev

      - name: Set up the package signing key
        # With a persistent key configured (ABUILD_PRIVKEY secret + a committed public
        # key under packaging/keys/), sign with it so anyone who trusts that public key
        # once can `apk add` every release without --allow-untrusted. Otherwise fall
        # back to a throwaway key (installs then need --allow-untrusted).
        env:
          ABUILD_PRIVKEY: ${{ secrets.ABUILD_PRIVKEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.abuild"
          pub="$(ls packaging/keys/*.rsa.pub 2>/dev/null | head -1 || true)"
          if [ -n "$ABUILD_PRIVKEY" ] && [ -n "$pub" ]; then
            key="$(basename "${pub%.pub}")"
            priv="$HOME/.abuild/$key"
            printf '%s\n' "$ABUILD_PRIVKEY" > "$priv"
            chmod 600 "$priv"
            cp "$pub" "$priv.pub"

            # Validate the secret here. abuild-sign runs `openssl dgst -sign` deep in
            # the build; a bad key there dies with an opaque OpenSSL decode stack
            # ("Could not find private key … Input structure: EncryptedPrivateKeyInfo").
            # Fail at this step with an actionable message instead. </dev/null so an
            # encrypted key errors out rather than blocking on a passphrase prompt.
            if ! openssl pkey -in "$priv" -noout </dev/null 2>/tmp/keyerr; then
              echo "::error::ABUILD_PRIVKEY is not a loadable, unencrypted PEM private key."
              echo "The secret must be the *verbatim* private key that matches $key.pub:"
              echo "  - full PEM incl. the -----BEGIN/END … PRIVATE KEY----- lines and every newline"
              echo "  - no passphrase (abuild-keygen keys are never encrypted)"
              echo "  - no extra base64/hex wrapping, no leading indent, not collapsed to one line"
              echo "  Set it straight from the key file to avoid paste corruption:"
              echo "    gh secret set ABUILD_PRIVKEY < ~/.abuild/$key"
              sed 's/^/  openssl: /' /tmp/keyerr || true
              exit 1
            fi

            # It must be the private half of the COMMITTED public key, else we would
            # sign every release with a key nobody trusts (installs would silently need
            # --allow-untrusted). Compare canonical SPKI serialisations of both.
            openssl pkey -in "$priv" -pubout 2>/dev/null > /tmp/derived.pub
            openssl pkey -pubin -in "$priv.pub" -pubout 2>/dev/null > /tmp/committed.pub
            if ! cmp -s /tmp/derived.pub /tmp/committed.pub; then
              echo "::error::ABUILD_PRIVKEY does not match the committed public key $key.pub."
              echo "Point the secret at that key's private half, or commit the .pub that"
              echo "pairs with this secret (the key id in the filename must match too)."
              exit 1
            fi

            echo "PACKAGER_PRIVKEY=$priv" > "$HOME/.abuild/abuild.conf"
            doas cp "$pub" /etc/apk/keys/
            echo "Signing with the committed release key: $key"
          else
            abuild-keygen -a -i -n
            echo "No ABUILD_PRIVKEY/pubkey configured — throwaway key (apk needs --allow-untrusted)"
          fi
        shell: alpine.sh {0}

      - name: Build the .apk
        # source= in packaging/APKBUILD points at the release tarball published by
        # the `release` job above, so this fetches over the network rather than
        # packaging the checkout directly — that's what makes this a real test of
        # what a pmOS packager building from the tagged release would get.
        #
        # abuild installs the makedepends via abuild-apk, which only lets members of
        # the `abuild` group escalate (setup-alpine's user isn't one). Add it, then
        # re-login with `doas su` so the fresh session actually picks up the new
        # group membership before running abuild.
        #
        # The doas-su re-login changes $HOME, so pin REPODEST to a known workspace
        # path — otherwise abuild drops the .apk under a home the Stage step (a
        # separate session) doesn't look in.
        run: |
          doas adduser "$(id -un)" abuild
          mkdir -p "$GITHUB_WORKSPACE/packages"
          pkgdir="$(pwd)/packaging"
          doas su "$(id -un)" -c "cd '$pkgdir' && export REPODEST='$GITHUB_WORKSPACE/packages' && abuild checksum && abuild -r"
        shell: alpine.sh {0}

      - name: Stage the .apk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find "$GITHUB_WORKSPACE/packages" -name '*.apk' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
        shell: alpine.sh {0}

      - uses: actions/upload-artifact@v4
        with:
          name: stoandl-gui-aarch64-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach .apk + signing key to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber
          # Publish the public signing key so users can trust it once, then apk add
          # without --allow-untrusted.
          for pub in packaging/keys/*.rsa.pub; do
            [ -f "$pub" ] && gh release upload "$GITHUB_REF_NAME" "$pub" --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}
