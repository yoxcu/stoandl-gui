# Flatpak manifest for the stoandl GUI. Built in CI (.github/workflows/release.yml)
# and shipped as a de.yoxcu.stoandl.gui.flatpak bundle on tagged releases.
#
# runtime-version tracks the GNOME runtime (org.gnome.Platform 47 == GTK 4.16 /
# libadwaita 1.6, which satisfies the crate's v4_12 / v1_6 feature minimums); bump
# it in lockstep with the CI container image tag (gnome-4x). The Rust toolchain
# comes from the org.freedesktop.Sdk.Extension.rust-stable SDK extension.
# glib-compile-resources (used by gtk/build.rs) ships inside org.gnome.Sdk, but
# blueprint-compiler does NOT, so it is built from source as a throwaway module
# below (see that module's comment) — otherwise gtk/build.rs panics with ENOENT.
#
# NETWORK BUILD (quick path): the stoandl-gui module builds with --share=network so
# cargo fetches crates straight from crates.io. This is CI-friendly but NOT
# Flathub-clean. FOLLOW-UP for a Flathub submission / reproducible offline build:
# generate data/cargo-sources.json from gtk/Cargo.lock with flatpak-cargo-generator.py,
# add it to sources:, drop --share=network, and build with `cargo --offline`.
id: de.yoxcu.stoandl.gui
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: stoandl-gui

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The GUI is a D-Bus client of the stoandl daemon on the session bus.
  - --talk-name=de.yoxcu.stoandl
  # NOTE: backup / restore / support-bundle shell out to the co-located `stoandl` CLI,
  # and "Start daemon" runs `systemctl --user` — neither works from inside the sandbox.
  # Those degrade gracefully; wiring them via `flatpak-spawn --host` (needs
  # --talk-name=org.freedesktop.Flatpak) is a deliberate follow-up, not enabled here.

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/stoandl-gui/cargo

modules:
  # gtk/build.rs shells out to `blueprint-compiler batch-compile`, but the tool is
  # NOT on the org.gnome.Sdk//47 sandbox PATH (only glib-compile-resources is), so
  # the build panics at build.rs:42 with ENOENT. Build it from source as a build-only
  # module — `cleanup: '*'` drops it from the shipped bundle. Source downloads happen
  # outside the sandbox, so no --share=network is needed here. Pinned near the 0.19.0
  # used in dev (.container/Dockerfile); the .blp files use only stock Gtk 4.0 / Adw 1
  # syntax, which any recent release compiles.
  - name: blueprint-compiler
    buildsystem: meson
    cleanup:
      - '*'
    sources:
      - type: git
        url: https://gitlab.gnome.org/jwestman/blueprint-compiler.git
        tag: v0.20.4

  - name: stoandl-gui
    buildsystem: simple
    build-options:
      # Quick path (see header): let cargo reach crates.io. Drop this once
      # data/cargo-sources.json is vendored for an offline Flathub build.
      build-args:
        - --share=network
    build-commands:
      # cargo builds only the binary — CMake used to install the desktop file,
      # metainfo, and icon tree, so we do that by hand below.
      - cargo build --release --manifest-path gtk/Cargo.toml
      - install -Dm755 gtk/target/release/stoandl-gui /app/bin/stoandl-gui
      - install -Dm644 data/de.yoxcu.stoandl.gui.desktop /app/share/applications/de.yoxcu.stoandl.gui.desktop
      - install -Dm644 data/de.yoxcu.stoandl.gui.metainfo.xml /app/share/metainfo/de.yoxcu.stoandl.gui.metainfo.xml
      - |
        for f in $(find data/icons/hicolor -type f); do
          install -Dm644 "$f" "/app/share/${f#data/}"
        done
    sources:
      # The manifest lives in data/, so the project root is one level up. A fresh CI
      # checkout has no build/ dir (it is git-ignored), so this copies clean sources.
      - type: dir
        path: ..
