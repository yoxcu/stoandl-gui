[package]
name = "stoandl-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "GTK4/libadwaita front-end for the stoandl Pebble daemon"
license = "GPL-3.0-or-later"
default-run = "stoandl-gui"

[[bin]]
name = "stoandl-gui"
path = "src/main.rs"

[dependencies]
# gtk4 pulls in glib/gio/gdk/gsk/graphene/cairo/pango, all re-exported.
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
# Extension config is a JSON schema/object on the wire (ExtConfigSchema/Get/Set).
serde_json = "1"

[build-dependencies]
glib-build-tools = "0.20"

[profile.dev]
opt-level = 1        # gtk-rs is slow at opt-level 0; keep dev usable

[profile.release]
lto = "thin"
strip = true
